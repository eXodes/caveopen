name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to release (defaults to HEAD)"
        required: false
        type: string
      bump:
        description: "Version bump (auto-detect from commits if omitted)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Detect version bump
        id: versioning
        uses: ./.github/actions/release-versioning
        with:
          type: ${{ inputs.bump || 'auto' }}

      - name: Sync package version to latest tag
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            npm version "${LATEST_TAG#v}" --no-git-tag-version --allow-same-version
          fi

      - name: Bump version
        id: version
        run: |
          RAW=$(npm version ${{ steps.versioning.outputs.bump }} --no-git-tag-version)
          echo "new_version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: npm run prepublishOnly

      - name: Publish to npm
        run: npm publish --ignore-scripts --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin HEAD:main "v${{ steps.version.outputs.new_version }}"

      - name: Create GitHub release
        id: release
        uses: ./.github/actions/release-notes
        with:
          tag: "v${{ steps.version.outputs.new_version }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release info
        run: |
          echo "🏷️ Released: v${{ steps.version.outputs.new_version }}"
          echo "🤖 Inferred type: ${{ steps.versioning.outputs.inferred-type }}"
          echo "📊 Commits analyzed: ${{ steps.versioning.outputs.commits-analyzed }}"
          echo "🌐 Release URL: ${{ steps.release.outputs.release-url }}"
          echo "::notice title=Release Created::v${{ steps.version.outputs.new_version }} published to npm — ${{ steps.release.outputs.release-url }}"
